apiVersion: apps/v1
kind: Deployment
metadata: 
  name: meudeployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: kubedevio/web-color:blue
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: webcolor
spec:
  selector:
    app: web
  ports:
    - port: 80 # Define qual porta do serviço será exposta
      targetPort: 80 # Define qual porta do container será exposta
      name: http
      protocol: TCP
  type: ClusterIP # Define o tipo de serviço, nesse caso, um serviço interno do cluster